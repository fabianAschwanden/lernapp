# Lernapp auf Fly.io: statische PWA hinter nginx (Dockerfile). Keine Secrets, keine Volumes.
# Deploy nur über GitHub Actions (.github/workflows/fly-deploy.yml).
app = "lernapp"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
