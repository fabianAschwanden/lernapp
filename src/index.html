<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <title>Lernapp</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Content-Security-Policy: nur eigene Skripte, keine fremden Bilder/Server ausser der Claude-API.
      Angular-Komponentenstile sind <style>-Elemente (deshalb 'unsafe-inline' nur für style-src).
      Kritisches CSS wird bewusst nicht inline geladen (angular.json: inlineCritical false), weil
      dafür ein Inline-Skript nötig wäre. pdf.js-Worker und Service Worker kommen von 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com; worker-src 'self' blob:; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="description" content="Lernstoff aus Skripten, Bildern und Büchern zusammenstellen und anhand der Lernziele üben." />
    <meta name="theme-color" content="#0b5d4b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lernapp" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Bitte JavaScript aktivieren, um die Lernapp zu verwenden.</noscript>
  </body>
</html>
