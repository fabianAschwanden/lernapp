# Statische Auslieferung der PWA. Fly terminiert TLS und leitet per HTTP auf 8080 weiter.

# Caching je Pfad: gehashte Bundles ewig, alles andere (Startseite, Service Worker,
# Manifest, Lektionen) immer frisch prüfen — sonst kommen Updates nicht an.
map $uri $cache_control {
  "~*-[A-Z0-9]{8}\.(js|css)$"  "public, max-age=31536000, immutable";
  "~*^/(bilder|icons)/"        "public, max-age=86400";
  default                    "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  types {
    text/html html;
    text/css css;
    text/javascript js mjs;
    application/json json;
    application/manifest+json webmanifest;
    image/svg+xml svg;
    image/png png;
    image/x-icon ico;
  }

  gzip on;
  gzip_types text/css text/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # Fehlende Dateien mit Endung sind echte 404 (kein index.html als «Bild»)
  location ~* "\.[a-z0-9]+$" {
    try_files $uri =404;
  }

  # App-Routen (z. B. /lektion/…/lernen) → index.html
  location / {
    try_files $uri /index.html;
  }
}
