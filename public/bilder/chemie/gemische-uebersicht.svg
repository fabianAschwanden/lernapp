<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 494"><g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" fill="#1f2a27"><g fill="none" stroke="#55625e" stroke-width="2"><path d="M300 48L122 80M300 48L444 80M444 136L153 176M444 136L447 176"/></g><rect x="220" y="8" width="160" height="40" rx="8" fill="#e8eef0" stroke="#55625e" stroke-width="2"/><text x="300" y="35" font-size="19" font-weight="700" text-anchor="middle">Stoffe</text><rect x="12" y="80" width="220" height="56" rx="8" fill="#e9f0ec" stroke="#4f8a6e" stroke-width="2"/><text x="122" y="104" font-size="18" font-weight="700" text-anchor="middle">Reinstoffe</text><text x="122" y="126" font-size="14" fill="#3b4a45" text-anchor="middle">ein Stoff, eine Teilchenart</text><rect x="290" y="80" width="298" height="56" rx="8" fill="#e8eef0" stroke="#55625e" stroke-width="2"/><text x="439" y="104" font-size="18" font-weight="700" text-anchor="middle">Stoffgemische</text><text x="439" y="126" font-size="14" fill="#3b4a45" text-anchor="middle">mehrere Stoffe, verschiedene Teilchen</text><rect x="12" y="176" width="282" height="310" rx="8" fill="#eef5fb" stroke="#2a7fc4" stroke-width="2"/><text x="153" y="200" font-size="18" font-weight="700" text-anchor="middle">homogen</text><text x="153" y="222" font-size="14" fill="#3b4a45" text-anchor="middle">eine Phase, wie ein Reinstoff</text><rect x="306" y="176" width="282" height="310" rx="8" fill="#fff6ee" stroke="#e08a3a" stroke-width="2"/><text x="447" y="200" font-size="18" font-weight="700" text-anchor="middle">heterogen</text><text x="447" y="222" font-size="14" fill="#3b4a45" text-anchor="middle">mehrere Phasen, oft trüb</text><g stroke="#c9d3d6" stroke-width="1.5"><path d="M24 236H282M24 274H282M24 312H282M24 350H282M24 388H282M318 236H576M318 274H576M318 312H576M318 350H576M318 388H576M318 426H576"/></g><g font-size="15"><text x="24" y="261"><tspan font-weight="700">Legierung</tspan> s/s</text><text x="24" y="299"><tspan font-weight="700">Lösung</tspan> s/l</text><text x="24" y="337"><tspan font-weight="700">Lösung</tspan> l/l</text><text x="24" y="375"><tspan font-weight="700">Lösung</tspan> g/l</text><text x="24" y="413"><tspan font-weight="700">Gasgemisch</tspan> g/g</text><text x="318" y="261"><tspan font-weight="700">Gemenge</tspan> s/s</text><text x="318" y="299"><tspan font-weight="700">Suspension</tspan> s/l</text><text x="318" y="337"><tspan font-weight="700">Emulsion</tspan> l/l</text><text x="318" y="375"><tspan font-weight="700">Nebel</tspan> l/g</text><text x="318" y="413"><tspan font-weight="700">Rauch</tspan> s/g</text><text x="318" y="451"><tspan font-weight="700">Schaum</tspan> g/l</text></g><g font-size="14" fill="#55625e" text-anchor="end"><text x="282" y="261">Messing</text><text x="282" y="299">Salzwasser</text><text x="282" y="337">Wodka</text><text x="282" y="375">Mineralwasser</text><text x="282" y="413">Luft</text><text x="576" y="261">Granit</text><text x="576" y="299">trüber Orangensaft</text><text x="576" y="337">Milch</text><text x="576" y="375">Wolken</text><text x="576" y="413">Russ</text><text x="576" y="451">Seifenblasen</text></g><text x="447" y="474" font-size="13" fill="#55625e" text-anchor="middle">Nebel und Rauch = Aerosole</text></g></svg>
