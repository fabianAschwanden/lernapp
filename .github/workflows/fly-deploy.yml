name: Test und Deploy auf Fly.io

# Testet (Lektionen, Unit, E2E) und deployt nach Fly (fly.toml).
# Voraussetzung: Repo-Secret FLY_API_TOKEN (fly tokens create deploy -a lernapp).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Lektionen prüfen
        run: node scripts/lektion-bauen.mjs --pruefen
      - name: Unit-Tests
        run: npx ng test --watch=false
      - name: Browser für E2E
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests
        run: npx playwright test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: flyctl einrichten
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Prüfen
        run: |
          url=https://lernapp.fly.dev
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' $url/lektion/informatik-pruefung-1) && [ "$code" = 200 ] && break
            sleep 5
          done
          echo "Startseite: $code"
          [ "$code" = 200 ] || { echo "::error::App antwortet mit $code"; exit 1; }
          curl -sf $url/lektionen/index.json | grep -q informatik-pruefung-1 || { echo "::error::Lektionen fehlen"; exit 1; }
          curl -sf -o /dev/null $url/ngsw.json || { echo "::error::Service Worker fehlt"; exit 1; }
